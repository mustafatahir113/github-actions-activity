name: Multi-OS Runner Demo

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Show runner information
        run: |
          echo "Running on: ${{ runner.os }}"
          echo "OS: ${{ matrix.os }}"
