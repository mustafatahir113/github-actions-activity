name: Module 6 - Matrix Cache Services

on:
  workflow_dispatch:

jobs:
  matrix-cache:
    name: Matrix - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Show runner
        run: echo "Matrix runner: ${{ runner.os }}"

  service-container:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: runnerpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Verify PostgreSQL service
        run: |
          echo "PostgreSQL service container configured"
          pg_isready -h localhost -p 5432 -U runner -d testdb
        env:
          PGPASSWORD: runnerpass
