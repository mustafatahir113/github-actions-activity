name: Secrets and Variables Demo

on:
  push:
    branches:
      - main

jobs:
  secrets-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Show repository variable
        run: |
          echo "Course: ${{ vars.COURSE_NAME }}"

      - name: Show encrypted secret
        run: |
          echo "Secret value: ${{ secrets.MY_SECRET }}"

      - name: Show GitHub Token
        run: |
          echo "GitHub Token: ${{ secrets.GITHUB_TOKEN }}"
