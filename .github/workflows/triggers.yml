name: Contexts and Conditionals Demo

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

env:
  DEMO_MESSAGE: "GitHub Actions Context Demo"

jobs:
  context-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Show context information
        run: |
          echo "Workflow trigger test successful!"
          echo "Actor: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Environment variable: $DEMO_MESSAGE"

      - name: Success condition
        if: success()
        run: |
          echo "This step runs because previous steps succeeded."

      - name: Contains condition
        if: contains(github.event_name, 'push')
        run: |
          echo "This step runs for a push event."

      - name: Failure condition
        if: failure()
        run: |
          echo "A previous step failed."

      - name: Always condition
        if: always()
        run: |
          echo "This step always runs."
