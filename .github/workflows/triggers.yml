
name: Workflow Triggers Demo

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

jobs:
  show-event:
    runs-on: ubuntu-latest

    steps:
      - name: Show event information
        run: |
          echo "Workflow trigger test successful!"
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Actor: ${{ github.actor }}"
